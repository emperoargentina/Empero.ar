<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO Meta Tags -->
    <title>Empero Argentina — Equipamiento Gastronómico Industrial</title>
    <meta name="description" content="Distribuidores oficiales de Empero en Argentina. Más de 3.000 productos para cocinas industriales, restaurantes y hoteles. Marca turca con presencia en 90+ países." />
    <meta name="keywords" content="equipamiento gastronomico, cocina industrial, Empero Argentina, lavavajillas industrial, hornos profesionales, freidoras, refrigeración industrial" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.empero.com.ar/" />

    <!-- Mobile Status Bar Configuration -->
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph -->
    <meta property="og:title" content="Empero Argentina — Equipamiento Gastronómico Industrial" />
    <meta property="og:description" content="Distribuidores oficiales de Empero en Argentina. +3.000 productos para cocinas profesionales." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:url" content="https://www.empero.com.ar/" />

    <!-- Critical asset preloads (LCP) -->
    <link rel="preload" as="image" href="/images/logo/Logo.png" />

    <!-- Google Fonts: preconnect first, then non-render-blocking stylesheet load -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Imágenes de stock (sección Nosotros / Navegación) -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" />
    </noscript>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />
  </head>
  <body style="background-color: #15120F">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
