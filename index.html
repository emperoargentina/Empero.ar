<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Critical asset preloads (LCP) -->
    <link rel="preload" as="image" href="/images/Visuales/heroteo.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/logo/Logo.png" />

    <!-- Google Fonts: preconnect first, then non-render-blocking stylesheet load -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Imágenes below-the-fold: dns-prefetch (no gastar socket en el LCP;
         se piden al scrollear, no en el critical path) -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap"

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      NOTA SEO LOCAL:
      - Dirección omitida a propósito (es un depósito, no local al público). Correcto no publicarla.
        En Google Business Profile podés crear un "negocio con área de servicio" que oculta la
        dirección exacta pero igual te posiciona en Argentina — esa es la vía recomendada.
      - Si en el futuro sumás Facebook/LinkedIn propios de Argentina, agregalos al array "sameAs".
    -->
  </head>
  <body style="background-color: #15120F">
    <div id="root">
      <!-- H1 para crawlers sin JS. React (createRoot) reemplaza este contenido al montar,
           por lo que en la app renderizada el único H1 es el del Hero. -->
      <h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">
        Empero Argentina — Equipamiento gastronómico profesional e industrial
      </h1>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
